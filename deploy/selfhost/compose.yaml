# 삼정 모아 자체 서버 (Windows + Docker Desktop). 설치·운영 안내: docs/SELF_HOST.md
# 실행: 이 폴더에서 `docker compose up -d --build`
name: moa

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moa
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD를 설정하세요}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa -d moa"]
      interval: 10s
      retries: 12

  # PDF·문서 업로드 검사. 첫 실행 때 바이러스 정의를 내려받느라 몇 분 걸린다.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped

  app:
    build: { context: ../.., dockerfile: Dockerfile }
    image: moa-app
    restart: unless-stopped
    env_file: .env
    environment: &app-env
      NODE_ENV: production
      APP_URL: https://${DOMAIN:?.env 파일에 DOMAIN을 설정하세요}
      DATABASE_URL: postgres://moa:${POSTGRES_PASSWORD}@db:5432/moa
      UPLOAD_PATH: /app/.data/uploads
      CLAMAV_HOST: clamav
      FREE_TIER_MODE: "false"
      MEDIA_BACKEND: local
    volumes: [uploads:/app/.data/uploads]
    depends_on:
      db: { condition: service_healthy }
    # 포트를 밖으로 열지 않는다. 외부 요청은 반드시 caddy를 거친다(접속자 IP 기반 요청 한도가 이 전제를 쓴다).

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]

  # 매일 03:00(KST): 오래된 첨부·휴지통 게시판 정리, 교사 그룹 재확인 (운영 Worker의 Cron과 같은 작업)
  daily:
    image: moa-app
    pull_policy: never # app 서비스가 빌드한 이미지를 함께 쓴다
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes: [uploads:/app/.data/uploads]
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "while true; do sleep $$(( (151200 - $$(date +%s) % 86400) % 86400 + 60 )); node --import tsx scripts/maintenance.ts || echo MAINTENANCE_FAILED; done"]

  # 매일 02:30(KST): DB와 업로드 파일을 ./backups 에 저장하고 14일 지난 것은 지운다.
  # 같은 PC의 디스크가 고장 나면 함께 잃으므로 ./backups 를 다른 곳(NAS·클라우드 동기화 폴더)으로 복사해 둔다.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - uploads:/uploads:ro
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["sh", "-c", "while true; do sleep $$(( (149400 - $$(date +%s) % 86400) % 86400 + 60 )); d=$$(date +%Y%m%d); pg_dump -h db -U moa -Fc moa > /backups/moa-$$d.dump && tar -czf /backups/uploads-$$d.tgz -C /uploads . && find /backups -name 'moa-*' -mtime +14 -delete && find /backups -name 'uploads-*' -mtime +14 -delete || echo BACKUP_FAILED; done"]

volumes:
  db: {}
  uploads: {}
  caddy: {}
